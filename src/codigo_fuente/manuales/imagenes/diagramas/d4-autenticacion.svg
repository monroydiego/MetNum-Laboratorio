kie</text><line x1="580" y1="376" x2="860" y2="376" stroke="#404040" stroke-width="1.6"  marker-end="url(#a)"/><rect x="593.6" y="359" width="252.79999999999998" height="17" fill="#FFFFFF" opacity="0.92"/><text x="720" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#404040" text-anchor="middle"  >7. exigir_docente consulta la sesión</text><line x1="580" y1="422" x2="330" y2="422" stroke="#404040" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="366" y="405" width="178" height="17" fill="#FFFFFF" opacity="0.92"/><text x="455" y="418" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#404040" text-anchor="middle"  >8. Datos protegidos o 401</text></svg>