<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#404040"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#404040"/></marker></defs><rect width="1000" height="470" fill="#FFFFFF"/><rect x="10" y="20" width="160" height="38" rx="6" fill="#E6E6E6" stroke="#595959" stroke-width="1.5" /><text x="90" y="44" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold" >Jugador</text><line x1="90" y1="58" x2="90" y2="450" stroke="#8C8C8C" stroke-dasharray="5 4"/><rect x="210" y="20" width="160" height="38" rx="6" fill="#E6E6E6" stroke="#595959" stroke-width="1.5" /><text x="290" y="44" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold" >Frontend</text><line x1="290" y1="58" x2="290" y2="450" stroke="#8C8C8C" stroke-dasharray="5 4"/><rect x="440" y="20" width="160" height="38" rx="6" fill="#E6E6E6" stroke="#595959" stroke-width="1.5" /><text x="520" y="44" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold" >API verificar</text><line x1="520" y1="58" x2="520" y2="450" stroke="#8C8C8C" stroke-dasharray="5 4"/><rect x="660" y="20" width="160" height="38" rx="6" fill="#E6E6E6" stroke="#595959" stroke-width="1.5" /><text x="740" y="44" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold" >Motor + reglas</text><line x1="740" y1="58" x2="740" y2="450" stroke="#8C8C8C" stroke-dasharray="5 4"/><rect x="840" y="20" width="160" height="38" rx="6" fill="#E6E6E6" stroke="#595959" stroke-width="1.5" /><text x="920" y="44" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold" >SQLite y disco</text><line x1="920" y1="58" x2="920" y2="450" stroke="#8C8C8C" stroke-dasharray="5 4"/><line x1="90" y1="100" x2="290" y2="100" stroke="#404040" stroke-width="1.6"  marker-end="url(#a)"/><rect x="77.2" y="83" width="225.6" height="17" fill="#FFFFFF" opacity="0.92"/><text x="190" y="96" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#404040" text-anchor="middle"  >1. Escribe respuesta y sube foto</text><line x1="290" y1="146" x2="520" y2="146" stroke="#404040" stroke-width="1.6"  marker-end="url(#a)"/><rect x="193.6" y="129" width="422.8" height="17" fill="#FFFFFF" opacity="0.92"/><text x="405" y="142" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#404040" text-anchor="middle"  >2. POST multipart (slug, entrada, respuesta, matrícula, foto)</text><line x1="520" y1="192" x2="740" y2="192" stroke="#404040" stroke-width="1.6"  marker-end="url(#a)"/><rect x="479.8" y="175" width="300.4" height="17" fill="#FFFFFF" opacity="0.92"/><text x="630" y="188" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#404040" text-anchor="middle"  >3. Revisa restricciones y ejecuta el método</text><line x1="740" y1="238" x2="520" y2="238" stroke="#404040" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="551.2" y="221" width="157.6" height="17" fill="#FFFFFF" opacity="0.92"/><text x="630" y="234" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#404040" text-anchor="middle"  >4. Resultado del libro</text><line x1="520" y1="284" x2="740" y2="284" stroke="#404040" stroke-width="1.6"  marker-end="url(#a)"/><rect x="500.2" y="267" width="259.6" height="17" fill="#FFFFFF" opacity="0.92"/><text x="630" y="280" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#404040" text-anchor="middle"  >5. Compara parte entera y 3 decimales</text><line x1="520" y1="330" x2="920" y2="330" stroke="#404040" stroke-width="1.6"  marker-end="url(#a)"/><rect x="583.4" y="313" width="273.2" height="17" fill="#FFFFFF" opacity="0.92"/><text x="720" y="326" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#404040" text-anchor="middle"  >6. Guarda la foto y registra el intento</text><line x1="520" y1="376" x2="290" y2="376" stroke="#404040" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="241.20000000000002" y="359" width="327.59999999999997" height="17" fill="#FFFFFF" opacity="0.92"/><text x="405" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#404040" text-anchor="middle"  >7. Veredicto, folio y resolución si es correcta</text><line x1="290" y1="422" x2="90" y2="422" stroke="#404040" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="26.200000000000017" y="405" width="327.59999999999997" height="17" fill="#FFFFFF" opacity="0.92"/><text x="190" y="418" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" fill="#404040" text-anchor="middle"  >8. Muestra resultado; si falla, resta 5 de vida</text></svg>